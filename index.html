<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>Vasanicola</title>
<!-- App installabile: aggiunta alla Home si apre a schermo intero, senza barre del browser -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vasanicola">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffaf0; --surface:#f8f1de; --surface-2:#efe5c8; --ink:#1f2758; --ink-2:#5b5f86; --line:#e4d9ba; --art-line:#26306a;
  --leaf:#2f9e55; --leaf-dark:#1f7a44; --leaf-shadow:#18603a;
  --water:#1e90ff; --water-dark:#1570cc; --water-bg:#e4f1ff;
  --sun:#ffbf1f; --sun-dark:#d99a00; --sun-bg:#fff4d1;
  --bad:#e5484d; --bad-dark:#b9363a; --bad-bg:#fde8e8;
  --dry:#b5832f; --dry-bg:#f7ead2;
  --soak:#0f7f7c; --soak-bg:#d8f2ef;
  --locked:#d9d2bd; --locked-dark:#b3aa8f;
  --display:"Mali", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
  --body:"Nunito", "Avenir Next", system-ui, -apple-system, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141a30; --surface:#1d2442; --surface-2:#273058; --ink:#f6efdc; --ink-2:#b9bad3; --line:#343d68; --leaf-dark:#7ad69a;
    --water-bg:#10283f; --sun-bg:#3a2e0b; --bad-bg:#3b1517; --dry-bg:#33280f; --soak:#4cc9c3; --soak-bg:#0f2d2b; --locked:#3a4166; --locked-dark:#2a304d; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#141a30; --surface:#1d2442; --surface-2:#273058; --ink:#f6efdc; --ink-2:#b9bad3; --line:#343d68; --leaf-dark:#7ad69a;
  --water-bg:#10283f; --sun-bg:#3a2e0b; --bad-bg:#3b1517; --dry-bg:#33280f; --soak:#4cc9c3; --soak-bg:#0f2d2b; --locked:#3a4166; --locked-dark:#2a304d; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--water);outline-offset:3px;border-radius:12px}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}

/* ---- Bottoni "da tasto" ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 20px;border-radius:16px;font-weight:900;font-size:17px;letter-spacing:.02em;text-transform:none;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--leaf-shadow)}
.btn.water{background:var(--water);box-shadow:0 4px 0 var(--water-dark)}
.btn.sun{background:var(--sun);color:#3b2a00;box-shadow:0 4px 0 var(--sun-dark)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-dark)}
.btn.ghost{background:var(--bg);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{background:var(--locked);color:var(--locked-dark);box-shadow:0 4px 0 var(--locked-dark);cursor:not-allowed}
.btn.small{min-height:40px;font-size:15px;border-radius:12px;padding:8px 14px}

/* ---- Barra in alto ---- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--line)}
.top::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;color:var(--leaf-dark)}
.pill{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;font-weight:900;font-size:15px}
.pill.water{background:var(--water-bg);color:var(--water)}
.pill.sun{background:var(--sun-bg);color:var(--sun-dark)}
.pill svg{width:18px;height:18px}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25)}}

/* ---- Tab ---- */
main{flex:1;padding:0 0 96px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;display:flex;background:var(--bg);border-top:2px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:12px;font-weight:900;color:var(--ink-2);border:2px solid transparent}
.tabs button svg{width:28px;height:28px}
.tabs button[aria-current="page"]{color:var(--leaf-dark);background:var(--surface);border-color:var(--line)}
.tabs .dot{position:absolute;margin-left:22px;margin-top:-2px;width:10px;height:10px;border-radius:50%;background:var(--bad)}

/* ---- Percorso ---- */
.zone{margin:20px 16px 8px;padding:16px 18px;border-radius:20px;color:#fff;background:var(--leaf);box-shadow:0 4px 0 var(--leaf-shadow);display:flex;align-items:center;gap:12px}
.zone.locked{background:var(--locked);box-shadow:0 4px 0 var(--locked-dark);color:var(--ink-2)}
.zone small{display:block;font-size:13px;opacity:.9;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.zone h2{font-size:23px}
.zone p{margin:4px 0 0;font-size:14px;opacity:.95}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 0 12px}
.node{position:relative;width:76px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--leaf);box-shadow:0 7px 0 var(--leaf-shadow);color:#fff;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--leaf-shadow)}
.node svg{width:36px;height:36px}
.node.done{background:var(--sun);box-shadow:0 7px 0 var(--sun-dark);color:#3b2a00}
.node.locked{background:var(--locked);box-shadow:0 7px 0 var(--locked-dark);color:var(--locked-dark);cursor:not-allowed}
.node.current::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--leaf);opacity:.35;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.15}}
.bubble{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--bg);color:var(--leaf-dark);border:2px solid var(--line);padding:8px 12px;border-radius:12px;white-space:nowrap;font-weight:900;font-size:14px;animation:float 2s ease-in-out infinite}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
@keyframes float{50%{transform:translate(-50%,-4px)}}
.ring{position:absolute;inset:-10px;border-radius:50%;z-index:-1;background:conic-gradient(var(--sun) calc(var(--p) * 1%), var(--surface-2) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px))}
.node.partial::after{display:none}
.nodelabel small{display:block;font-size:12px;color:var(--sun-dark)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-height:56px}
.lrow .t{flex:1}.lrow .t b{display:block;font-size:16px}.lrow .t small{color:var(--ink-2);font-size:13px}
.lrow .lico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--leaf);color:#fff;flex:none}
.lrow .lico svg{width:20px;height:20px}
.lrow.done .lico{background:var(--sun);color:#3b2a00}
.lrow.locked{opacity:.55;cursor:not-allowed}.lrow.locked .lico{background:var(--locked);color:var(--locked-dark)}
.lrow.next{border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf)}
.nodelabel{font-size:13px;color:var(--ink-2);margin-top:6px;text-align:center}
.nodewrap{display:flex;flex-direction:column;align-items:center}
.teaser{margin:4px 16px 24px;padding:14px 16px;border:2px dashed var(--line);border-radius:16px;color:var(--ink-2);font-size:14px;line-height:1.45}

/* ---- Lezione ---- */
.lesson{min-height:100vh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.lhead button{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.prog{flex:1;height:16px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .4s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.kind{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--leaf-dark);margin-bottom:6px}
.q{font-family:var(--display);font-size:24px;line-height:1.2;margin-bottom:18px}
.qbody{flex:1;display:flex;flex-direction:column}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;font-size:17px;line-height:1.5;font-weight:700}
.card .art{display:grid;place-items:center;margin:-6px 0 8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:17px;background:var(--bg);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt[aria-pressed="true"]{border-color:var(--water);background:var(--water-bg);box-shadow:0 4px 0 var(--water)}
.opt.ok{border-color:var(--leaf);background:var(--surface);box-shadow:0 4px 0 var(--leaf)}
.opt.ko{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{text-align:center;font-size:19px;padding:22px}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ids .opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{text-align:center;font-size:15px;padding:12px 8px;min-height:62px;display:grid;place-items:center}
.match .opt.ok:disabled{opacity:.55;cursor:default;transform:none}
.lfoot{margin-top:18px}
.sheet{position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;width:100%;max-width:460px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;transition:transform .25s ease;z-index:20}
.sheet.show{transform:translate(-50%,0)}
.sheet.ok{background:var(--surface-2)}
.sheet.ko{background:var(--bad-bg)}
.sheet h3{font-size:22px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sheet.ok h3{color:var(--leaf-dark)}
.sheet.ko h3{color:var(--bad)}
.sheet p{margin:0 0 14px;font-size:15px;line-height:1.45}

/* ---- Risultato ---- */
.result{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 20px calc(24px + env(safe-area-inset-bottom,0px));gap:16px}
.result h1{font-size:32px;color:var(--leaf-dark)}
.result .sub{color:var(--ink-2);font-size:16px;margin:-6px 0 4px;max-width:320px}
.rewards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.reward{border-radius:18px;padding:14px;border:2px solid}
.reward.water{border-color:var(--water);color:var(--water)}
.reward.sun{border-color:var(--sun-dark);color:var(--sun-dark)}
.reward b{display:block;font-family:var(--display);font-size:32px}
.reward span{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.kl{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
.krow{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.krow .t{flex:1}
.krow .t b{display:block;font-size:16px}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .8s ease}
.bar.full i{background:var(--leaf)}
.tag{font-size:12px;font-weight:900;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.ready{background:var(--leaf);color:#fff}
.tag.study{background:var(--surface-2);color:var(--ink-2)}
.tag.planted{background:var(--water-bg);color:var(--water)}

/* ---- Serra ---- */
.sec{padding:20px 16px 0}
.sec h1{font-size:28px}
.sec .lead{color:var(--ink-2);font-size:15px;margin:4px 0 16px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--bg);box-shadow:0 4px 0 var(--line);min-height:230px}
.slot h3{font-size:17px}
.slot .state{font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px}
.st-sana{background:var(--surface-2);color:var(--leaf-dark)}
.st-assetata{background:var(--water-bg);color:var(--water)}
.st-appassita{background:var(--dry-bg);color:var(--dry)}
.st-secca,.st-marcita{background:var(--bad-bg);color:var(--bad)}
.st-zuppa,.st-fradicia{background:var(--soak-bg);color:var(--soak)}
.namerow{display:flex;align-items:center;justify-content:center;gap:2px;max-width:100%}
.namerow h3{overflow-wrap:anywhere}
.nick{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}
.nick svg{width:20px;height:20px}
.care{display:flex;gap:6px;align-items:flex-start;text-align:left;font-size:12px;line-height:1.3;color:var(--water);background:var(--water-bg);border-radius:10px;padding:6px 8px;width:100%}
.care svg{width:14px;height:14px;flex:none;margin-top:1px}
.age{font-size:12px;font-weight:900;color:var(--sun-dark)}
.species{font-size:12px;color:var(--ink-2);margin-top:-6px}
.field{width:100%;min-height:52px;margin:14px 0;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:17px}
.field:focus{outline:none;border-color:var(--water)}
.slot .line{font-size:13px;color:var(--ink-2);min-height:36px;line-height:1.35}
.slot .btn{margin-top:auto}
.acts{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px}
.acts .btn{margin-top:0}
.feel{color:var(--dry)}
.area{margin-top:22px}
.area h2{font-size:22px;display:flex;align-items:baseline;gap:8px}
.area h2 span{font-family:var(--body);font-size:14px;color:var(--ink-2)}
.area .lead{margin:2px 0 12px}
.slot.wide{min-height:0;padding:20px}
.slot.alarm{border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.emerg{width:100%;display:flex;gap:8px;align-items:flex-start;text-align:left;padding:8px 10px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-size:13px;line-height:1.3;border:2px solid var(--bad)}
.emerg b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.emerg span{color:var(--ink)}.emerg b{color:var(--bad)}
.emerg svg{width:18px;height:18px;flex:none;margin-top:2px}
.slot.empty{border-style:dashed;justify-content:center;color:var(--ink-2)}
.slot.locked{background:var(--surface);border-style:dashed;justify-content:center;color:var(--ink-2)}
.plus{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--leaf-dark);font-size:32px;line-height:1}
.test{margin:28px 16px 0;padding:14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-size:13px;color:var(--ink-2)}
.test b{display:block;color:var(--ink);font-size:14px;margin-bottom:8px}
.test .row{display:flex;gap:8px;flex-wrap:wrap}
.test .row .btn{width:auto;flex:1 1 auto}

/* ---- Erbario e schede ---- */
.herb{display:flex;flex-direction:column;gap:10px}
.herb .krow{cursor:pointer;text-align:left;width:100%}
.unknown{opacity:.55}
.modal{position:fixed;inset:0;background:rgba(10,30,15,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{width:100%;max-width:460px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}}
.panel h2{font-size:24px}
.panel .facts{margin:12px 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.panel .facts li{background:var(--surface);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.4}
.panel .facts li.lock{color:var(--ink-2);background:transparent;border:2px dashed var(--line)}
.pick{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:40;max-width:90%;text-align:center;animation:fade .2s}

/* ---- Bentornato ---- */
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 22px calc(24px + env(safe-area-inset-bottom,0px));gap:10px}
.wsay{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:16px;line-height:1.4;max-width:340px;margin-bottom:10px}
.wsay::after{content:"";position:absolute;top:100%;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--line)}
.wlabel{font-size:14px;color:var(--ink-2);margin-top:6px}
.welcome h1{font-size:32px;line-height:1.05;color:var(--leaf-dark);text-wrap:balance}
.wsub{margin:0;font-size:16px;color:var(--ink-2);font-style:italic;max-width:320px;line-height:1.4}
.wchips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.wchip{display:flex;align-items:baseline;gap:5px;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--leaf-dark);font-size:14px}
.wchip b{font-family:var(--display);font-size:18px}
.wchip.water{background:var(--water-bg);color:var(--water)}.wchip.bad{background:var(--bad-bg);color:var(--bad)}.wchip.dead{background:var(--dry-bg);color:var(--dry)}
.wacts{width:100%;margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:12px}
/* ---- Onboarding ---- */
.onb{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px calc(24px + env(safe-area-inset-bottom,0px));gap:18px}
.onb h1{font-size:34px;line-height:1.08;color:var(--leaf-dark)}
.onb p{font-size:18px;line-height:1.45;color:var(--ink-2);margin:0;max-width:340px}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--leaf);width:26px;border-radius:5px}
.mascot{animation:wobble 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wobble{50%{transform:rotate(-3deg)}}

/* ---- Illustrazioni "fatte a mano": contorno blu + tratto tremolante (filtro #wob) ---- */
.art :is(path,ellipse,circle,rect)[fill]:not([fill="none"]):not([stroke]):not(.no){stroke:var(--art-line);stroke-width:1.7px;stroke-linejoin:round}
/* stati delle piante */
.p-assetata .leaves{transform:rotate(4deg) skewX(-4deg);transform-origin:50% 90%;filter:saturate(.75) brightness(1.05)}
.p-appassita .leaves{transform:rotate(9deg) skewX(-9deg) scaleY(.9);transform-origin:50% 95%;filter:sepia(.75) saturate(.8) hue-rotate(-15deg) brightness(.95)}

// Ogni casella (step) ha: le lezioni scritte (la prima è step.items, le altre in EXTRA) + un "Allenamento"
// generato pescando a caso le sue domande. Il Ripasso di fine zona pesca da tutta la zona.
const EXTRA = {};
const authored = st => [{ title:"Le basi", items: st.items }, ...(EXTRA[st.id] || [])];
const lessonCount = st => authored(st).length + 1;
const lessonTitle = (st, li) => li < authored(st).length ? authored(st)[li].title : (st.icon === "star" ? "Ripasso a sorpresa" : "Allenamento");
function practiceItems(st){
  const pool = (st.icon === "star" ? STEPS.filter(x => x.zone === st.zone) : [st]).flatMap(x => authored(x).flatMap(l => l.items)).filter(it => it.t !== "card");
  return shuffle(pool).slice(0, 6);
}
const lessonItems = (st, li) => li < authored(st).length ? authored(st)[li].items : practiceItems(st);
const progOf = st => S.prog[st.id] || (S.done.includes(st.id) ? lessonCount(st) : 0);
const stepDone = st => progOf(st) >= lessonCount(st);

    { t:"id", plant:"zamioculcas", q:"Quale è la zamioculcas?", o:["spatifillo","zamioculcas","pothos","sansevieria"], a:"zamioculcas", why:"Steli dritti con foglioline lucide a coppie, come plastificate. Molti la credono finta (lei se ne offende)." },
    { t:"tf", plant:"zamioculcas", q:"La zamioculcas sopravvive anche lontano dalla finestra.", a:true, why:"Tollera la poca luce meglio di quasi tutte. Cresce più lenta, ma non si lamenta." },
    { t:"mc", plant:"spatifillo", q:"Lo spatifillo fiorisce anche con poca luce?", o:["Sì, è una delle poche piante da casa che fiorisce in mezza ombra","No, solo in pieno sole","Solo se gli canti qualcosa"], a:0, why:"È il suo superpotere: fiori bianchi anche lontano dalla finestra. Basta che non sia buio pesto." },
    { t:"id", plant:"spatifillo", q:"Riconosci lo spatifillo?", o:["zamioculcas","menta","spatifillo","basilico"], a:"spatifillo", why:"Foglie lunghe e lucide, e quel “fiore” bianco a vela con una spiga al centro." },
    { t:"tf", plant:"spatifillo", q:"Il “fiore” bianco dello spatifillo è in realtà una foglia trasformata.", a:true, why:"La vela bianca è una brattea: i fiori veri, minuscoli, stanno sulla spiga al centro." }
  ]}],
  s3:[{ title:"Chi parla e chi tace", items:[
    { t:"card", plant:"spatifillo", title:"Piante drammatiche e piante stoiche", body:"Alcune piante ti avvisano quando hanno sete, con una scena madre. Altre accumulano acqua e stanno zitte per settimane. Conoscerne il carattere evita omicidi." },
    { t:"mc", plant:"spatifillo", q:"Lo spatifillo ha tutte le foglie afflosciate. Cosa fai?", o:["Lo annaffi: in poche ore si rialza","Lo butti, è morto","Lo metti al sole per tirarlo su"], a:0, why:"Quando ha sete si affloscia in modo teatrale, e dopo l’acqua si riprende. Meglio non farglielo fare spesso." },
    { t:"tf", plant:"zamioculcas", q:"La zamioculcas va annaffiata spesso, come la menta.", a:false, why:"I rizomi sotto terra le fanno da borraccia: ogni 2-3 settimane basta. Il pericolo è l’acqua in più." },
    { t:"mc", plant:"zamioculcas", q:"Cosa sono i bulbi grossi sotto terra della zamioculcas?", o:["Rizomi che accumulano acqua","Patate dimenticate","Uova di lumaca"], a:0, why:"Sono rizomi, riserve d’acqua. Per questo perdona le dimenticanze e odia l’acqua ferma." },
    { t:"tf", plant:"spatifillo", q:"Lo spatifillo è innocuo se lo morde il gatto.", a:false, why:"Come il pothos, irrita bocca e stomaco di cani e gatti. Meglio fuori portata." }
  ]}],
  s4:[{ title:"Il rinvaso", items:[
    { t:"card", title:"Casa nuova, ma non troppo grande", body:"Prima o poi ogni pianta diventa troppo grande per il suo vaso. Il rinvaso è un trasloco: va fatto al momento giusto, e senza esagerare con lo spazio. Il monolocale in sei non va bene, ma neanche la villa con piscina." },
    { t:"mc", q:"Come capisci che una pianta va rinvasata?", o:["Le radici escono dai fori o girano attorno al vaso","Ha compiuto un anno","Ti sembra annoiata"], a:0, why:"Radici dai fori o arrotolate in cerchio: il vaso è diventato stretto." },
    { t:"mc", q:"Quanto più grande deve essere il vaso nuovo?", o:["Poco: qualche centimetro di diametro in più","Il doppio, così non ci pensi più","Uguale, ma di un altro colore"], a:0, why:"Troppa terra in più resta bagnata a lungo e rischia di far marcire le radici." },
    { t:"tf", plant:"zamioculcas", q:"I rizomi della zamioculcas possono deformare un vaso di plastica stretto.", a:true, why:"Crescono e spingono: a volte il vaso si gonfia o si spacca. È il suo modo di chiedere casa nuova." },
    { t:"mc", plant:"spatifillo", q:"Lo spatifillo è diventato un cespuglio enorme. Puoi...", o:["Dividerlo in più ciuffi, ognuno con le sue radici, e rinvasarli","Tagliarlo a metà con le forbici, foglie comprese","Lasciarlo esplodere"], a:0, why:"Si divide il cespo con le radici: da una pianta ne ottieni due o tre." }
  ]}],
  m1:[{ title:"Agrumi e salvia", items:[
    { t:"card", plant:"limone", title:"Il limone in vaso", body:"Il limone è il sogno di ogni balcone: fiori profumati, frutti gialli, foglie lucide tutto l’anno. È mediterraneo d’adozione: viene dall’Asia, ma ormai qui è di casa." },
    { t:"mc", plant:"limone", q:"Dove sta bene il limone in vaso d’estate?", o:["In pieno sole, al riparo dal vento forte","In un angolo d’ombra fresca","In casa vicino al termosifone"], a:0, why:"Sole pieno: senza, niente fiori e niente limoni. Solo foglie e delusione." },
    { t:"id", plant:"limone", q:"Quale è il limone?", o:["salvia","olivo","limone","lavanda"], a:"limone", why:"Foglie lucide e ovali, e i limoni appesi. Con i limoni è facile, ammettiamolo." },
    { t:"id", plant:"salvia", q:"Riconosci la salvia?", o:["rosmarino","salvia","limone","lavanda"], a:"salvia", why:"Foglie ovali, grigio-verdi e vellutate. Profumo di burro e salvia." },
    { t:"tf", plant:"salvia", q:"Le foglie vellutate e grigie aiutano la salvia a perdere meno acqua al sole.", a:true, why:"I peli sottili riflettono la luce e trattengono umidità: la stessa strategia dell’olivo." },
    { t:"tf", plant:"salvia", q:"Salvia e rosmarino sono parenti stretti.", a:true, why:"Così stretti che dal 2017 il rosmarino si chiama Salvia rosmarinus. Riunione di famiglia sul balcone." }
  ]}],
  m2:[{ title:"Acqua e calcare", items:[
    { t:"card", plant:"limone", title:"Foglie gialle, ma non per l’autunno", body:"Il limone vuole acqua regolare, ma odia i ristagni. E ha un nemico nascosto: il calcare. Con acqua e terra troppo calcaree, le foglie ingialliscono anche se le venature restano verdi." },
    { t:"mc", plant:"limone", q:"Le foglie del limone ingialliscono, ma le venature restano verdi. Cosa vuol dire?", o:["Gli manca il ferro, spesso per colpa del calcare","Ha preso troppo sole","Sta per fare i limoni"], a:0, why:"È la clorosi ferrica: con il calcare il ferro non viene assorbito. Si usa un concime con ferro per agrumi." },
    { t:"mc", plant:"limone", q:"Quando si annaffia il limone in vaso d’estate?", o:["Quando i primi centimetri di terra sono asciutti","Tutti i giorni, a prescindere","Una volta al mese"], a:0, why:"Regolare, ma a terra asciutta in superficie. I ristagni gli fanno cadere le foglie." },
    { t:"tf", plant:"salvia", q:"La salvia vuole la terra sempre bagnata.", a:false, why:"Come il rosmarino, preferisce terra drenante e poca acqua. Bagnata di continuo marcisce." },
    { t:"mc", plant:"salvia", q:"La salvia in vaso: meglio una terra...", o:["Drenante, anche con un po’ di sabbia","Argillosa e pesante","Sempre allagata"], a:0, why:"Drenante: le radici devono respirare tra un’annaffiatura e l’altra." }
  ]}],
  m3:[{ title:"Potare salvia e limone", items:[
    { t:"card", plant:"salvia", title:"Legno, ma non troppo", body:"Come la lavanda, anche la salvia con gli anni diventa legnosa alla base. Una potatura in primavera la tiene giovane e folta. Magari funzionasse anche con noi." },
    { t:"mc", plant:"salvia", q:"Quando si pota la salvia?", o:["In primavera, quando riparte, accorciando i rami","In pieno inverno, a raso","Mai, si offende"], a:0, why:"In primavera, togliendo i rami secchi e accorciando gli altri. Senza arrivare al legno vecchio e spoglio." },
    { t:"tf", plant:"salvia", q:"Raccogliere spesso le punte della salvia la aiuta a restare compatta.", a:true, why:"Raccogliere le punte è una piccola potatura: la pianta ramifica. E tu cucini." },
    { t:"mc", plant:"limone", q:"Dalla base del limone spuntano rami dritti e velocissimi, con le spine. Cosa sono?", o:["Polloni del portainnesto, da tagliare","Rami nuovi che faranno limoni giganti","Un regalo della natura da lasciare"], a:0, why:"Spesso il limone è innestato su un’altra pianta: quei rami vengono da lì e gli rubano energie. Si tagliano." },
    { t:"tf", plant:"limone", q:"Il limone va potato a fondo ogni anno per fare frutti.", a:false, why:"Basta una potatura leggera: rami secchi, incrociati e polloni. Troppi tagli, meno fiori." }
  ]}],
  m4:[{ title:"Il limone d’inverno", items:[
    { t:"card", plant:"limone", title:"La limonaia", body:"Sul lago di Garda, secoli fa, si costruivano le limonaie: serre di pietra e vetro per far passare l’inverno ai limoni. Sul balcone basta meno, ma il principio è lo stesso: luce e niente gelo." },
    { t:"mc", plant:"limone", q:"D’inverno, al Nord, il limone in vaso...", o:["Va in un posto riparato e luminoso, dove non gela","Resta fuori, è robusto","Va in cantina al buio fino a marzo"], a:0, why:"Teme il gelo ma vuole luce anche d’inverno: veranda, scala luminosa, o vicino al muro e coperto." },
    { t:"tf", plant:"limone", q:"D’inverno il limone va annaffiato come d’estate.", a:false, why:"Con il freddo beve molto meno: troppa acqua fredda nel vaso e le radici soffrono." },
    { t:"tf", plant:"salvia", q:"La salvia sopporta bene il freddo dell’inverno.", a:true, why:"È più rustica del limone: regge il freddo, basta che la terra non resti fradicia." },
    { t:"mc", plant:"salvia", q:"Perché salvia e limone d’inverno si trattano in modo diverso?", o:["Il limone teme il gelo, la salvia lo sopporta","La salvia costa di più","Il limone va in letargo come gli orsi"], a:0, why:"Stessa zona, caratteri diversi: il limone è freddoloso, la salvia no." }
  ]}],
  j1:[{ title:"Il ficus permaloso", items:[
    { t:"card", plant:"ficus", title:"Il gigante di gomma", body:"Il ficus elastica ha foglie grandi, spesse e lucide, come di gomma. Un tempo dal suo lattice si ricavava proprio la gomma. In casa è facile, se rispetti una regola: non spostarlo di continuo." },
    { t:"mc", plant:"ficus", q:"Dove sta bene il ficus elastica?", o:["In un posto luminoso, senza sole diretto che scotta","Al buio, tanto è robusto","Sul balcone in pieno inverno"], a:0, why:"Luce indiretta e intensa. Al buio si allunga e perde le foglie in basso." },
    { t:"tf", plant:"ficus", q:"Se sposti spesso il ficus, può perdere le foglie per protesta.", a:true, why:"Odia i cambi di luce e di posto: trovagli un angolo buono e lascialo in pace." },
    { t:"id", plant:"ficus", q:"Quale è il ficus elastica?", o:["monstera","ficus","calathea","felce"], a:"ficus", why:"Un fusto dritto con foglie grandi, ovali e lucidissime. E una punta rossa da cui esce la foglia nuova." },
    { t:"mc", plant:"ficus", q:"Le foglie del ficus sono piene di polvere. Perché è un problema?", o:["La polvere ruba luce alla foglia","Gli viene l’allergia","Non è un problema, è vintage"], a:0, why:"La polvere fa da tenda: un panno umido sulle foglie ogni tanto e torna a respirare." }
  ]}],
  j2:[{ title:"Bere dall’aria", items:[
    { t:"card", plant:"tillandsia", title:"La pianta senza terra", body:"La tillandsia non ha bisogno di terra: assorbe acqua e nutrienti dalle foglie, coperte di minuscole squame argentate. In natura sta appesa agli alberi e beve pioggia e umidità." },
    { t:"tf", plant:"tillandsia", q:"La tillandsia va piantata nel terriccio per sopravvivere.", a:false, why:"Vive senza terra. Nel terriccio sempre umido marcisce." },
    { t:"mc", plant:"tillandsia", q:"Come si annaffia la tillandsia?", o:["Un bagno di 20-30 minuti in acqua, poi ad asciugare capovolta","Una goccia al mese","Si interra e si annaffia la terra"], a:0, why:"Ammollo, poi asciugatura a testa in giù: l’acqua ferma al centro della rosetta la fa marcire." },
    { t:"id", plant:"tillandsia", q:"Riconosci la tillandsia?", o:["felce","orchidea","tillandsia","calathea"], a:"tillandsia", why:"Un ciuffo di foglie argentate e arricciate, senza vaso. Sembra un ragno vegetale (simpatico)." },
    { t:"tf", plant:"tillandsia", q:"Il colore argentato della tillandsia viene da minuscole squame che catturano l’acqua.", a:true, why:"Si chiamano tricomi: sono le sue cannucce. Più è argentata, più ama la luce." }
  ]}],
  j3:[{ title:"Radici che non bevono", items:[
    { t:"card", plant:"tillandsia", title:"A cosa servono le radici?", body:"Siamo abituati a pensare che le radici servano a bere. Per alcune piante non è così: la tillandsia usa le radici solo per aggrapparsi, come ancore." },
    { t:"mc", plant:"tillandsia", q:"A cosa servono le radici della tillandsia?", o:["Solo ad aggrapparsi","A bere tantissimo","A niente, sono decorative"], a:0, why:"Per bere usa le foglie. Le radici sono ganci per restare attaccata ai rami." },
    { t:"tf", plant:"tillandsia", q:"Tillandsia e orchidea sono epifite: in natura vivono sopra gli alberi.", a:true, why:"Epifita vuol dire che vive sopra un’altra pianta senza rubarle niente: la usa solo come appoggio." },
    { t:"mc", plant:"ficus", q:"Se tagli un ramo del ficus esce un liquido bianco. Cos’è?", o:["Lattice: appiccicoso e irritante, meglio usare i guanti","Latte vegetale da bere","Il segno che è malato"], a:0, why:"È lattice: irrita pelle e occhi. Guanti, e niente esperimenti culinari." },
    { t:"tf", plant:"ficus", q:"In natura, le radici aeree del ficus elastica possono diventare nuovi tronchi.", a:true, why:"Scendono dai rami e diventano colonne. In casa succede di rado, per fortuna del soffitto." }
  ]}],
  j4:[{ title:"Figli e fioriture", items:[
    { t:"card", plant:"tillandsia", title:"Fiorire una volta sola", body:"La tillandsia fiorisce una sola volta nella vita, con colori accesissimi. Dopo, lentamente, la pianta madre declina. Ma prima fa i figli. Un finale da film drammatico, ma con lieto fine." },
    { t:"tf", plant:"tillandsia", q:"Dopo la fioritura la tillandsia fa dei piccoli figli alla base.", a:true, why:"Crescono attaccati alla madre e diventano piante nuove." },
    { t:"mc", plant:"tillandsia", q:"Quando puoi staccare un figlio della tillandsia?", o:["Quando è grande circa un terzo della madre","Appena spunta","Mai, va lasciato attaccato per sempre"], a:0, why:"Quando è abbastanza grande si stacca con delicatezza. Oppure li lasci insieme e fai un ciuffo enorme." },
    { t:"mc", plant:"ficus", q:"Il ficus perde le foglie in basso, una dopo l’altra. Cosa controlli?", o:["Luce e acqua: spesso è poca luce o terra sempre bagnata","Se ha visto un fantasma","Niente, per lui è autunno"], a:0, why:"Poca luce o troppa acqua sono le cause più comuni. E il trasloco, se l’hai spostato da poco." }
  ]}]
});

// Zona 4: Fiori da balcone
STEPS.push(
  { id:"f1", zone:"z4", title:"Sole e fioriture", icon:"sun", items:[
    { t:"card", plant:"geranio", title:"Il re dei balconi", body:"Il geranio dei balconi in realtà non è un geranio: è un Pelargonium. I botanici li hanno separati da secoli, ma il nome è rimasto. Un errore diventato tradizione, come la panna nella carbonara (no)." },
    { t:"mc", plant:"geranio", q:"Quanto sole vuole il geranio?", o:["Tanto: almeno mezza giornata di sole","Pochissimo, è timido","Solo luce artificiale"], a:0, why:"Più sole, più fiori. All’ombra fa foglie e basta." },
    { t:"tf", plant:"geranio", q:"Il geranio dei balconi in realtà è un Pelargonium.", a:true, why:"Il vero geranio è un’altra pianta, più da prato. Ma ormai lo chiamiamo così tutti." },
    { t:"id", plant:"petunia", q:"Quale è la petunia?", o:["geranio","petunia","ortensia","bouganville"], a:"petunia", why:"Fiori a trombetta, tantissimi, che ricadono dal vaso. E foglie un po’ appiccicose." },
    { t:"mc", plant:"petunia", q:"La petunia in vaso d’estate beve...", o:["Tanto: a volte ogni giorno","Pochissimo, una volta al mese","Solo quando piove"], a:0, why:"In un vaso piccolo e al sole si secca in fretta. D’estate controllala ogni giorno." },
    { t:"tf", plant:"ortensia", q:"L’ortensia vuole sole pieno tutto il giorno.", a:false, why:"Preferisce mezz’ombra: con il sole forte del pomeriggio si affloscia e si brucia." }
  ]},
  { id:"f2", zone:"z4", title:"Fiori a ripetizione", icon:"leaf", items:[
    { t:"card", plant:"petunia", title:"Togli il vecchio, arriva il nuovo", body:"Quando un fiore appassisce, la pianta inizia a fare semi. E fare semi stanca: restano meno energie per i fiori nuovi. Togliendo i fiori secchi, la convinci a fiorire ancora." },
    { t:"mc", plant:"petunia", q:"Perché si tolgono i fiori appassiti della petunia?", o:["Così non fa semi e continua a fiorire","Perché sono brutti e basta","Per darli alle formiche"], a:0, why:"Senza semi da preparare, la pianta investe in fiori nuovi." },
    { t:"tf", plant:"geranio", q:"Anche il geranio fiorisce di più se togli gli steli dei fiori secchi.", a:true, why:"Si stacca tutto lo stelo del fiore appassito: così ne arrivano altri." },
    { t:"mc", q:"Che concime aiuta le piante da fiore?", o:["Uno ricco di potassio, per le fioriture","Solo azoto, per fare tante foglie","Il fondo della moka, a cucchiaiate"], a:0, why:"Il potassio aiuta i fiori, l’azoto spinge le foglie. Per i balconi fioriti c’è il concime per piante da fiore." },
    { t:"tf", plant:"petunia", q:"Le foglie della petunia sono un po’ appiccicose al tatto.", a:true, why:"Sono coperte di peli ghiandolari. Non è sporco, è lei." }
  ]},
  { id:"f3", zone:"z4", title:"Colori che cambiano", icon:"drop", items:[
    { t:"card", plant:"ortensia", title:"Il trucco dell’ortensia", body:"Alcune ortensie cambiano colore a seconda della terra. In terra acida diventano blu, in terra calcarea rosa. È chimica, non magia. Ma sembra magia." },
    { t:"mc", plant:"ortensia", q:"In che terra un’ortensia tende a diventare blu?", o:["Acida","Calcarea","Sabbia di mare"], a:0, why:"Nella terra acida l’alluminio si scioglie e la pianta lo assorbe: i fiori diventano blu." },
    { t:"tf", plant:"ortensia", q:"Tutte le ortensie cambiano colore con la terra.", a:false, why:"Solo alcune, soprattutto quelle colorate. Le ortensie bianche restano bianche, coerenti." },
    { t:"mc", plant:"bouganville", q:"La parte colorata della bouganville è...", o:["Brattee: foglie colorate attorno ai fiori veri","Petali giganti","Frutti a forma di foglia"], a:0, why:"I fiori veri sono i tubetti bianchi al centro. Il colore lo fanno le brattee, come la vela dello spatifillo." },
    { t:"tf", plant:"bouganville", q:"I veri fiori della bouganville sono piccoli e bianchi.", a:true, why:"Piccolissimi, al centro delle brattee colorate. I veri protagonisti, e nessuno li nota." }
  ]},
  { id:"f4", zone:"z4", title:"Inverno e potatura", icon:"pot", items:[
    { t:"card", plant:"geranio", title:"Passare l’inverno", body:"Gerani e bouganville vengono da posti caldi: il gelo li uccide. L’ortensia invece l’inverno lo regge, ma va potata con attenzione, o l’anno dopo niente fiori." },
    { t:"mc", plant:"geranio", q:"Come fai passare l’inverno al geranio, al Nord?", o:["In un posto luminoso e fresco, al riparo dal gelo, con pochissima acqua","Fuori sotto la neve, così si fortifica","Vicino al termosifone, annaffiato ogni giorno"], a:0, why:"Luminoso, fresco e riparato, con acqua quasi zero: aspetta la primavera." },
    { t:"tf", plant:"geranio", q:"Il geranio si moltiplica facilmente per talea.", a:true, why:"Un rametto di una decina di centimetri in terra: radica in poche settimane. Gerani gratis per tutti." },
    { t:"mc", plant:"ortensia", q:"Se poti l’ortensia nel momento sbagliato, rischi...", o:["Di tagliare i boccioli dei fiori dell’anno dopo","Che diventi un cactus","Niente, si può tagliare quando vuoi"], a:0, why:"Molte ortensie fioriscono sui rami dell’anno prima: tagliandoli in autunno togli i fiori futuri." },
    { t:"tf", plant:"bouganville", q:"La bouganville sopporta bene il gelo.", a:false, why:"Teme il freddo: sotto lo zero si rovina. Al Nord, d’inverno, va al riparo." }
  ]},
  { id:"f5", zone:"z4", title:"Ripasso", icon:"star", items:[
    { t:"id", plant:"bouganville", q:"Quale è la bouganville?", o:["geranio","ortensia","petunia","bouganville"], a:"bouganville", why:"Rami lunghi e legnosi coperti di brattee fucsia, come carta velina." },
    { t:"mc", plant:"ortensia", q:"Ortensia blu, terra...", o:["Acida","Calcarea","Di Marte"], a:0, why:"Acida. Su Marte non abbiamo dati." },
    { t:"tf", plant:"petunia", q:"Togliere i fiori secchi della petunia la fa fiorire di più.", a:true, why:"Niente semi, più fiori. Funziona sempre." },
    { t:"mc", plant:"geranio", q:"Il geranio dei balconi in realtà è...", o:["Un Pelargonium","Una rosa travestita","Un cactus"], a:0, why:"Pelargonium. Ma continueremo tutti a chiamarlo geranio." },
    { t:"match", q:"Abbina fiore e segreto", pairs:[["Geranio","In realtà è un Pelargonium"],["Petunia","Foglie appiccicose"],["Ortensia","Cambia colore con la terra"],["Bouganville","Il colore è nelle brattee"]] }
  ]}
);
Object.assign(EXTRA, {
  f1:[{ title:"Chi vuole il sole, chi no", items:[
    { t:"card", plant:"ortensia", title:"Sole sì, ma con giudizio", body:"Sullo stesso balcone puoi avere il geranio che si abbronza e l’ortensia che cerca l’ombra. Il trucco è sapere chi va dove: il lato del sole del mattino per le delicate, quello del pomeriggio per le sole-dipendenti." },
    { t:"mc", plant:"ortensia", q:"Dove metti l’ortensia sul balcone?", o:["In mezz’ombra, magari con il sole solo al mattino","Nel punto più assolato","Dentro casa, al buio"], a:0, why:"Sole del mattino e ombra nel pomeriggio: il suo compromesso ideale." },
    { t:"id", plant:"ortensia", q:"Riconosci l’ortensia?", o:["bouganville","geranio","petunia","ortensia"], a:"ortensia", why:"Grandi palle di fiori, blu o rosa, e foglie larghe seghettate. La nonna ne aveva una, sicuro." },

/* =========================================================
   Logica del giardino
   ========================================================= */
const daysSince = t => Math.floor((now() - t) / DAY);
// wet = quante volte di fila è stata annaffiata con la terra ancora umida.
// Si asciuga di un livello ogni "soak" giorni senza acqua.
// "soak" = per quanti giorni la terra resta bagnata dopo un'annaffiatura (dipende dalla pianta).
const care = g => PLANTS[g.plant].care;
const wetLevel = g => Math.max(0, (g.wet || 0) - Math.floor(daysSince(g.wateredAt) / care(g).soak));
const nameOf = g => g.nick || PLANTS[g.plant].name;
// Accordo maschile/femminile in base alla pianta (il basilico, la menta...)
const gen = (id, m, f) => PLANTS[id].g === "m" ? m : f;
function plantState(g){ if (g.dead) return g.cause === "marcita" ? "marcita" : "secca";
  const w = wetLevel(g); if (w >= 2) return "fradicia"; if (w === 1) return "zuppa";
  const d = daysSince(g.wateredAt), c = care(g);
  if (d >= c.dead) return "secca"; if (d >= c.wilt) return "appassita"; if (d >= c.thirsty) return "assetata"; return "sana"; }
const STATE_LINE = {
  sana:["Sta benone. Sospetto.","Felice. Non abituarti.","Viva e vegeta (letteralmente)."],
  assetata:["Ha sete e un leggero rancore.","Ti fissa. Ha sete. (Ti fissa.)","Gradirebbe un bicchiere. Anche due."],
  appassita:["Respira ancora (a fatica) (per colpa tua).","Fa scena. (Ma ha ragione.)"],
  secca:["Ci ha lasciati. Però ha lasciato un seme (e un messaggio passivo-aggressivo)."],
  zuppa:["Ha bevuto. Anche troppo.","Sta facendo il bagno. Non richiesto."],
  fradicia:["Le radici chiedono aria (e un avvocato).","Un altro sorso e marcisce. Fidati."],
  marcita:["Annegata d’affetto. Però ha lasciato un seme."]
};
const pickLine = (k, i) => STATE_LINE[k][i % STATE_LINE[k].length];
// Quando una pianta muore, il soprannome se ne va con lei (resta solo il ricordo, in g.rip)
// Giorni di vita: dalla semina a oggi (o al giorno della morte). Primo giorno = 1.
const ageOf = g => Math.floor(((g.dead ? g.diedAt : now()) - g.bornAt) / DAY) + 1;
const ageText = g => { const a = ageOf(g); return a === 1 ? "Primo giorno di vita" : `${a} giorni di vita`; };
// Traguardi da festeggiare: una settimana, un mese, cento giorni, un anno
const MILESTONES = [[7,"Una settimana insieme. Record personale?"],[30,"Un mese insieme. Ormai è di famiglia (quella che sopporti)."],[100,"Cento giorni. Questa pianta si fida di te. Non deluderla."],[365,"Un anno. (Chi l’avrebbe mai detto.) (Nessuno.)"]];
let cheers = [];
function settleMilestones(){
  S.garden.forEach(g => { if (g.dead) return;
    const m = MILESTONES.filter(([d]) => ageOf(g) >= d).pop();
    if (m && (g.mile || 0) < m[0]) { if (g.mile !== undefined || ageOf(g) - m[0] < 7) cheers.push(`${nameOf(g)}: ${m[1]}`); g.mile = m[0]; } });
}
function kill(g, cause, note, at){ g.diedAt = Math.min(at || now(), now()); g.dead = true; g.cause = cause; g.note = note || null; delete g.em; if (g.nick) { g.rip = g.nick; delete g.nick; } }
// Ogni giorno passato, ogni pianta sana senza emergenze ha una probabilità di averne una.
// Si scelgono solo problemi di cui hai già fatto lo step, così la cura la conosci (o dovresti).
const EM = { chance:.1, maxActive:2, deadline:7, calm:4, cureGocce:3, cureXp:5 };
function rollEmergency(g, at){
  const pool = Object.keys(EMERG).filter(id => EMERG[id].plant === g.plant && S.done.includes(EMERG[id].step) && id !== g.lastEm);
  if (!pool.length) return;
  const id = pool[Math.floor(Math.random() * pool.length)];
  g.em = { id, at, retryAt:0 }; g.lastEm = id;
}
function settleEmergencies(){
  const today = Math.floor(now() / DAY);
  if (S.emDay == null) S.emDay = today;
  while (S.emDay < today) {
    S.emDay++;
    const at = S.emDay * DAY;
    S.garden.forEach(g => {
      if (g.dead || g.em || (g.calmUntil || 0) > at || S.garden.filter(x => x.em).length >= EM.maxActive) return;
      if (Math.random() < EM.chance) rollEmergency(g, at);
    });
  }
  // Un’emergenza ignorata troppo a lungo uccide la pianta
  S.garden.forEach(g => { if (!g.dead && g.em && now() - g.em.at >= EM.deadline * DAY) kill(g, "emergenza", `Nessuno se n’è occupato. ${EMERG[g.em.id].why}`, g.em.at + EM.deadline * DAY); });
}
function settleDeaths(){ S.garden.forEach(g => { if (!g.dead && daysSince(g.wateredAt) >= care(g).dead) kill(g, "secca", null, g.wateredAt + care(g).dead * DAY); }); }
// Piante su cui hai appena fatto la prova del dito (vale finché non annaffi o passa il tempo)
let felt = new WeakSet();
function soilFeel(g){
  const c = care(g), d = daysSince(g.wateredAt), st = plantState(g);
  if (wetLevel(g) > 0) return c.feelWet || "Fango. Le dita escono sporche: niente acqua per un po’.";
  if (d < c.soak) return c.feelDamp || "Umida, fresca sotto il dito. Ancora niente acqua.";
  if (st === "assetata" || st === "appassita") return c.feelDry || "Secca e dura, anche più in fondo. Acqua, e in fretta.";
  return c.feelReady || "Asciutta nei primi centimetri. È il momento giusto per annaffiare.";
}
const kOf = id => S.knowledge[id] || 0;
const isReady = id => kOf(id) >= RULES.knowledgeMax;
const inGarden = id => S.garden.some(g => g.plant === id);
// Due aree: in casa solo piante da casa, sul balcone tutte. Il balcone si apre finendo la zona 1.
const AREAS = { casa:{ title:"Casa", lead:"Il davanzale. Solo piante da interni (come te, d’inverno)." }, balcone:{ title:"Balcone", lead:"Sole, vento, piccioni. Qui ci sta tutto, piante da casa comprese." } };
const slotsOf = a => a === "casa" ? S.slots : S.balcSlots;
const inArea = a => S.garden.filter(g => g.area === a).length;
const freeSlots = a => slotsOf(a) - inArea(a);
const balconyOpen = () => STEPS.filter(s => s.zone === "z1").every(s => S.done.includes(s.id));
const fitsIn = (id, a) => a === "balcone" || PLANTS[id].indoor;
const thirstyCount = () => S.garden.filter(g => g.em || ["assetata","appassita","secca","marcita"].includes(plantState(g))).length;

/* =========================================================
   Render
   ========================================================= */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
function toast(msg){ document.querySelector(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), Math.min(7000, 2000 + msg.length * 45)); }
function bump(sel){ const el = document.querySelector(sel); if (el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } }

function topbar(){
  return `<header class="top"><div class="brand">${mascot(30)}<b>Vasanicola</b></div>
    <div class="pill water" id="pGocce" aria-label="Gocce">${ICON.drop}${S.gocce}</div>
    <div class="pill sun" id="pXp" aria-label="Esperienza">${ICON.sun}${S.xp}</div></header>`;
}
function tabbar(){
  const t = (id, label, icon, dot) => `<button data-tab="${id}" ${tab === id ? 'aria-current="page"' : ""}>${dot ? '<span class="dot"></span>' : ""}${icon}${label}</button>`;
  return `<nav class="tabs" aria-label="Sezioni">${t("path","Percorso",ICON.path)}${t("serra","Serra",ICON.serra, thirstyCount() > 0)}${t("erbario","Erbario",ICON.book)}</nav>`;
}
function render(){
  settleDeaths(); settleEmergencies(); settleMilestones(); save();
  if (cheers.length && S.onboarded) { const msg = cheers.join(" "); cheers = []; setTimeout(() => toast(msg), 300); }
  if (!S.onboarded) return renderOnboarding(0);
  if (!welcomed) { welcomed = true; return renderWelcome(); }
  const body = tab === "path" ? renderPath() : tab === "serra" ? renderSerra() : renderErbario();
  app.innerHTML = topbar() + `<main>${body}</main>` + tabbar();
}

/* --- Bentornato: si vede una volta a ogni apertura, dopo l’onboarding --- */
let welcomed = false;
const GREETINGS = [
  "Oh, ci sei. Le piante avevano iniziato a parlare male di te.",
  "Eccoti. Il davanzale ti aspettava (il davanzale no, le piante sì).",
  "Ciao. Ti ho sognato. Avevi un annaffiatoio in mano. Era un incubo?",
  "Finalmente. Temevo avessi ripiegato sulle piante finte."
];
// Il "personaggio" del giorno dipende dallo stato della serra: il primo che corrisponde vince
function todayCharacter(st){
  if (!S.garden.length) return ["Erborista da Divano", "Sa tutto sulle piante. Non ne ha neanche una."];
  if (st.em) return ["Custode in Allarme Rosso", "Una pianta ha un problema e tu stai leggendo questa frase."];
  if (st.dead > st.alive) return ["Negromante del Davanzale", "Le piante le ha. Vive, è un altro discorso."];
  if (st.thirsty) return ["Custode della Siccità", "Le piante hanno sete. Tu, evidentemente, hai altro da fare."];
  if (st.wet) return ["Alluvione Ambulante", "Ama le piante. Troppo. Fisicamente."];
  if (st.alive >= 4) return ["Entità del Pollice Verde", "Tutte vive. Nessuna emergenza. Sospetto."];
  return ["Apprendista del Davanzale", "Poche piante, ma vive. Si parte da qui (si spera)."];
}
function renderWelcome(){
  const alive = S.garden.filter(g => !g.dead), states = alive.map(plantState);
  const st = { alive: alive.length, dead: S.garden.length - alive.length, em: alive.filter(g => g.em).length,
    thirsty: states.filter(x => x === "assetata" || x === "appassita").length, wet: states.filter(x => x === "zuppa" || x === "fradicia").length };

  app.innerHTML = `<section class="welcome">

/* --- Onboarding --- */

/* --- Percorso --- */
function renderPath(){
  const cur = STEPS.findIndex(s => !S.done.includes(s.id));
  const offsets = [0, 52, 70, 30, -40, -64, -20];
  return ZONES.map((z, zi) => {
    const steps = STEPS.map((s, i) => [s, i]).filter(([s]) => s.zone === z.id);
    const first = steps[0][1], open = cur === -1 || first <= cur;
    const nodes = steps.map(([s, i], k) => {
      const done = S.done.includes(s.id), current = i === cur, locked = cur !== -1 && i > cur;
      const pr = progOf(s), n = lessonCount(s), partial = !done && pr > 0;
      const cls = (done ? "done" : current ? "current" : locked ? "locked" : "") + (partial ? " partial" : "");
      const ico = done ? ICON.check : locked ? ICON.lock : ICON[s.icon];
      const ring = partial ? `<span class="ring" style="--p:${Math.round(pr / n * 100)}" aria-hidden="true"></span>` : "";
      return `<div class="nodewrap" style="transform:translateX(${offsets[k % offsets.length]}px)">
        <button class="node ${cls}" data-step="${i}" aria-label="${esc(s.title)}${done ? ", completato" : locked ? ", bloccato" : `, lezione ${pr + 1} di ${n}`}" ${locked ? "aria-disabled=\"true\"" : ""}>${ring}${current ? `<span class="bubble">${partial ? "Continua" : S.done.length ? "Avanti" : "Inizia da qui"}</span>` : ""}${ico}</button>
        <div class="nodelabel">${esc(s.title)}${partial ? `<small>${pr}/${n}</small>` : ""}</div></div>`;
    }).join("");
    return `<div class="zone ${open ? "" : "locked"}"><div><small>Zona ${zi + 1}</small><h2>${z.title}</h2><p>${open ? z.desc : `Si apre finendo ${ZONES[zi - 1].title}.`}</p></div></div><div class="path">${nodes}</div>`;
  }).join("") + `<div class="teaser">${cur === -1 ? "Hai finito tutte le zone. La prossima è in arrivo: intanto, le tue piante hanno bisogno di te." : "Altre zone del pianeta in arrivo nelle prossime versioni."}</div>`;
}

function openNode(i){
  const st = STEPS[i], pr = progOf(st), n = lessonCount(st);
  const rows = Array.from({ length: n }, (_, li) => {
    const state = li < pr ? "done" : li === pr ? "next" : "locked";
    const icon = state === "done" ? ICON.check : state === "next" ? ICON[st.icon] : ICON.lock;
    const label = state === "done" ? "Rifalla" : state === "next" ? "Inizia" : "Bloccata";
    return `<button class="lrow ${state}" data-lesson="${li}" ${state === "locked" ? "disabled" : ""}><span class="lico">${icon}</span><span class="t"><b>${esc(lessonTitle(st, li))}</b><small>Lezione ${li + 1} di ${n}</small></span><span class="tag ${state === "next" ? "ready" : "study"}">${label}</span></button>`;
  }).join("");
  const m = modal(`<div class="kind" style="margin:0">${esc(ZONES.find(z => z.id === st.zone).title)}</div><h2>${esc(st.title)}</h2>
    <p style="color:var(--ink-2);margin:6px 0 0;font-size:15px">${pr >= n ? "Fatta tutta. Puoi rifare le lezioni per ripassare (e per qualche goccia)." : `${pr} di ${n} lezioni fatte. L’ultima è un allenamento a sorpresa.`}</p>
    <div class="pick">${rows}</div><button class="btn ghost" data-close="1">Chiudi</button>`);
  m.querySelectorAll("[data-lesson]").forEach(b => b.onclick = () => { m.remove(); startLesson(i, +b.dataset.lesson); });
}

/* --- Lezione --- */
let L = null;
function startLesson(i, li){
  const step = STEPS[i];
  if (li === undefined) li = Math.min(progOf(step), lessonCount(step) - 1);   // di default: la prossima da fare
  L = { i, li, step, items: lessonItems(step, li), idx: 0, mistakes: 0, gained:{}, seen:[], replay: li < progOf(step) };
  showItem();
}
function shuffle(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function showItem(){
  const it = L.items[L.idx];
  const pct = Math.round(L.idx / L.items.length * 100);
  let inner = "", kind = "";
  if (it.t === "card") { kind = "Scheda"; inner = `<div class="q">${esc(it.title)}</div><div class="card">${it.plant ? `<div class="art">${plantSVG(it.plant, 110)}</div>` : ""}${esc(it.body)}</div>`; }
  if (it.t === "mc") { kind = "Scegli la risposta"; inner = `<div class="q">${esc(it.q)}</div><div class="opts">${it.o.map((o, k) => `<button class="opt" data-k="${k}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>`; }
  if (it.t === "tf") { kind = "Vero o falso?"; inner = `<div class="q">${esc(it.q)}</div><div class="tf"><button class="opt" data-k="true" aria-pressed="false">Vero</button><button class="opt" data-k="false" aria-pressed="false">Falso</button></div>`; }
  if (it.t === "id") { kind = "Riconosci la pianta"; inner = `<div class="q">${esc(it.q)}</div><div class="ids">${it.o.map(p => `<button class="opt" data-k="${p}" aria-pressed="false" aria-label="Pianta ${["A","B","C","D"][it.o.indexOf(p)]}">${plantSVG(p, 92)}</button>`).join("")}</div>`; }
  if (it.t === "match") { kind = "Abbina le coppie"; const L1 = shuffle(it.pairs.map(p => p[0])), R1 = shuffle(it.pairs.map(p => p[1]));
    inner = `<div class="q">${esc(it.q)}</div><div class="match">${L1.map((l, k) => `<button class="opt" data-side="l" data-v="${esc(l)}">${esc(l)}</button><button class="opt" data-side="r" data-v="${esc(R1[k])}">${esc(R1[k])}</button>`).join("")}</div>`; }
  app.innerHTML = `<section class="lesson"><div class="lhead"><button id="quit" aria-label="Esci dalla lezione">${ICON.x}</button><div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    <div class="qbody"><div class="kind">${kind}</div>${inner}</div>
    <div class="lfoot"><button class="btn" id="check" ${it.t === "card" ? "" : "disabled"}>${it.t === "card" ? "Ho capito" : "Controlla"}</button></div></section>
    <div class="sheet" id="sheet" role="status" aria-live="polite"></div>`;
  requestAnimationFrame(() => { const bar = app.querySelector(".prog i"); if (bar) bar.style.width = pct + "%"; });
  document.getElementById("quit").onclick = () => ask("Mollare adesso?", "Vasanicola ci resterà male (lo nasconde bene) (non lo nasconde). E i progressi di questo step si perdono.", "Esci lo stesso", () => { L = null; render(); }, "Resto, dai");
  const check = document.getElementById("check");
  if (it.t === "card") { check.onclick = next; return; }
  if (it.t === "match") return setupMatch(it, check);
  let sel = null;
  app.querySelectorAll(".qbody .opt").forEach(b => b.onclick = () => { app.querySelectorAll(".qbody .opt").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); sel = b.dataset.k; check.disabled = false; });
  check.onclick = () => {
    const ok = it.t === "mc" ? +sel === it.a : it.t === "tf" ? (sel === "true") === it.a : sel === it.a;
    app.querySelectorAll(".qbody .opt").forEach(x => { x.disabled = true; const k = x.dataset.k;
      const right = it.t === "mc" ? +k === it.a : it.t === "tf" ? (k === "true") === it.a : k === it.a;
      if (right) x.classList.add("ok"); else if (k === sel) x.classList.add("ko"); });
    feedback(ok, it.why, it.plant);
  };
}
function setupMatch(it, check){
  let pick = null, left = it.pairs.length, errors = 0;
  const map = Object.fromEntries(it.pairs);
  app.querySelectorAll(".match .opt").forEach(b => b.onclick = () => {
    if (!pick || pick.dataset.side === b.dataset.side) { app.querySelectorAll(".match .opt").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); pick = b; return; }
    const l = pick.dataset.side === "l" ? pick : b, r = pick.dataset.side === "l" ? b : pick;
    if (map[l.dataset.v] === r.dataset.v) { [l, r].forEach(x => { x.classList.add("ok"); x.disabled = true; }); left--; if (!left) { check.disabled = false; check.textContent = "Continua"; } }
    else { errors++; [l, r].forEach(x => { x.classList.add("ko"); setTimeout(() => x.classList.remove("ko"), 500); }); }
    app.querySelectorAll(".match .opt").forEach(x => x.setAttribute("aria-pressed", "false")); pick = null;
  });
  check.onclick = () => feedback(errors === 0, errors === 0 ? "Tutte giuste al primo colpo. Sospetto." : `Fatte, con ${errors} ${errors === 1 ? "errore" : "errori"} per strada. Conta che sono arrivate.`, it.plant);
}
const OK_TITLES = ["Giusto!","Esatto. Chi ti ha insegnato?","Pollice verde (in prova).","Corretto. Vasanicola annuisce."];
const KO_TITLES = ["Ehm, no.","Quasi. (Non proprio.)","La pianta ha visto tutto.","No, ma con convinzione."];
function feedback(ok, why, plant){
  if (!ok) L.mistakes++;
  if (ok && plant) L.gained[plant] = (L.gained[plant] || 0) + 1;
  // La pianta incontrata si segna solo per questa lezione: diventa "scoperta" a lezione finita
  if (plant && !L.seen.includes(plant)) L.seen.push(plant);
  const sh = document.getElementById("sheet");
  sh.className = "sheet " + (ok ? "ok" : "ko");
  const title = (ok ? OK_TITLES : KO_TITLES)[Math.floor(Math.random() * 4)];
  sh.innerHTML = `<h3>${ok ? ICON.check.replace("<svg", '<svg width="26" height="26"') : ICON.x.replace("<svg", '<svg width="24" height="24"')}${title}</h3><p>${esc(why || "")}</p><button class="btn ${ok ? "" : "bad"}" id="cont">Continua</button>`;
  requestAnimationFrame(() => sh.classList.add("show"));
  document.getElementById("check").style.visibility = "hidden";
  document.getElementById("cont").onclick = next;
}
function next(){ L.idx++; if (L.idx >= L.items.length) finishLesson(); else showItem(); }
function finishLesson(){
  const perfect = L.mistakes === 0;
  const g = L.replay ? RULES.replayGocce : RULES.stepGocce + (perfect ? RULES.perfectBonusGocce : 0);
  const x = L.replay ? RULES.replayXp : RULES.stepXp + (perfect ? RULES.perfectBonusXp : 0);
  S.gocce += g; S.xp += x;
  const before = {};
  Object.entries(L.gained).forEach(([p, n]) => { before[p] = kOf(p); S.knowledge[p] = Math.min(RULES.knowledgeMax, kOf(p) + n); });
  L.seen.forEach(p => { if (!S.discovered.includes(p)) S.discovered.push(p); });
  if (!L.replay) S.prog[L.step.id] = L.li + 1;
  const nodeDone = stepDone(L.step) && !S.done.includes(L.step.id);
  if (stepDone(L.step) && !S.done.includes(L.step.id)) S.done.push(L.step.id);
  const unblocked = S.garden.filter(x => x.em && x.em.retryAt > now() && EMERG[x.em.id].step === L.step.id);
  unblocked.forEach(x => x.em.retryAt = 0);
  save();
  const rows = Object.keys(L.gained).map(p => { const k = kOf(p), full = k >= RULES.knowledgeMax;
    return `<div class="krow">${plantSVG(p, 46)}<div class="t"><b>${PLANTS[p].name}</b><div class="bar ${full ? "full" : ""}"><i data-to="${k / RULES.knowledgeMax * 100}" style="width:${before[p] / RULES.knowledgeMax * 100}%"></i></div></div>${full ? (inGarden(p) ? '<span class="tag planted">In serra</span>' : '<span class="tag ready">Pronta!</span>') : `<span class="tag study">${k}/${RULES.knowledgeMax}</span>`}</div>`; }).join("");
  const readyNow = Object.keys(L.gained).some(p => isReady(p) && !inGarden(p));
  const lines = perfect ? ["Zero errori. Hai studiato botanica di nascosto? (Ammettilo.)","Perfetto. Vasanicola piange (di gioia) (forse)."] : ["Fatto. Qualche foglia persa per strada (e qualche neurone).","Completato. Gli errori sono concime. (Lo diciamo per consolarti.)"];
  app.innerHTML = `<section class="result">${mascot(130)}<div class="kind" style="margin:0">${esc(L.step.title)}: ${esc(lessonTitle(L.step, L.li))}</div><h1>${L.replay ? "Ripasso fatto!" : nodeDone ? "Casella completata!" : "Lezione completata!"}</h1><p class="sub">${lines[Math.floor(Math.random() * 2)]}</p>
    <div class="rewards"><div class="reward water"><b>+${g}</b><span>Gocce</span></div><div class="reward sun"><b>+${x}</b><span>Esperienza</span></div></div>
    ${perfect && !L.replay ? `<p class="sub" style="margin:0">Bonus senza errori incluso.</p>` : ""}
    ${rows ? `<div class="kl"><div class="kind" style="margin:6px 0 0">Conoscenza</div>${rows}</div>` : ""}
    <div style="width:100%;margin-top:auto;display:flex;flex-direction:column;gap:12px">
      ${unblocked.length ? `<p class="sub" style="margin:0">Ora sai cosa fare: puoi riprovare a curare ${unblocked.map(x => esc(nameOf(x))).join(" e ")}.</p><button class="btn bad" id="toSerra">Torna a curarla</button>` : readyNow ? `<button class="btn sun" id="toSerra">Vai a piantarla</button>` : ""}
      <button class="btn ${readyNow || unblocked.length ? "ghost" : ""}" id="toPath">Continua</button></div></section>`;
  setTimeout(() => app.querySelectorAll(".bar i").forEach(i => i.style.width = i.dataset.to + "%"), 250);
  document.getElementById("toPath").onclick = () => { L = null; tab = "path"; render(); };
  const ts = document.getElementById("toSerra"); if (ts) ts.onclick = () => { L = null; tab = "serra"; render(); };
}

/* --- Serra --- */
function slotCard(g, i){
  const st = plantState(g), p = PLANTS[g.plant], c = care(g);
  const line = g.dead ? `${g.rip ? `Addio, ${esc(g.rip)}. ` : ""}Ha vissuto ${ageOf(g)} ${ageOf(g) === 1 ? "giorno" : "giorni"}. ${g.note || (g.cause === "marcita" ? c.wetTip : c.dryTip)}`
    : felt.has(g) ? `<b class="feel">Prova del dito:</b> ${soilFeel(g)}` : g.em ? "" : pickLine(st, i);
  const em = !g.dead && g.em ? `<button class="emerg" data-em="${i}">${ICON.alert}<span><b>Emergenza</b>${esc(EMERG[g.em.id].title)}</span></button>` : "";
  const action = g.dead
    ? `<button class="btn small" data-replant="${i}" ${S.gocce < RULES.replantCost ? "disabled" : ""}>Ripianta il seme ${RULES.replantCost}${ICON.drop.replace("<svg", '<svg width="16" height="16"')}</button>`
    : `<div class="acts"><button class="btn small ghost" data-feel="${i}">Dito nella terra</button><button class="btn small water" data-water="${i}" ${S.gocce < RULES.waterCost ? "disabled" : ""}>Annaffia ${RULES.waterCost}${ICON.drop.replace("<svg", '<svg width="16" height="16"')}</button></div>`;
  return `<div class="slot${em ? " alarm" : ""}">${plantSVG(g.plant, 96, st)}<div class="namerow"><h3>${esc(nameOf(g))}</h3>${g.dead ? "" : `<button class="nick" data-nick="${i}" aria-label="Dai un soprannome a ${esc(nameOf(g))}">${ICON.pencil}</button>`}</div>${g.nick ? `<span class="species">${p.name}</span>` : ""}<span class="state st-${st}">${st[0].toUpperCase() + st.slice(1)}</span>${g.dead ? "" : `<span class="age">${ageText(g)}</span>`}${em}<div class="line">${line}</div><div class="care">${ICON.drop}<span>${c.rule}</span></div>${action}</div>`;
}
function renderArea(a){
  const A = AREAS[a];
  if (a === "balcone" && !balconyOpen()) return `<div class="area"><h2>${A.title}</h2><div class="slot locked wide">${ICON.lock.replace("<svg", '<svg width="34" height="34"')}<b>Balcone chiuso</b><span class="line">Si apre finendo la zona Casa tua, insieme al Mediterraneo.</span></div></div>`;
  const slots = [];
  S.garden.forEach((g, i) => { if (g.area === a) slots.push(slotCard(g, i)); });
  for (let k = inArea(a); k < slotsOf(a); k++) slots.push(`<button class="slot empty" data-plant-here="${a}"><span class="plus">+</span><b>Posto libero</b><span class="line">${a === "casa" ? "Una pianta da casa che conosci bene." : "Qualsiasi pianta che conosci bene."}</span></button>`);
  const nextCost = RULES.slotCosts[a][slotsOf(a)];
  if (nextCost !== undefined) slots.push(`<div class="slot locked">${ICON.lock.replace("<svg", '<svg width="34" height="34"')}<b>Posto bloccato</b><span class="line">Più spazio, più piante da far sopravvivere.</span><button class="btn small sun" data-buy="${a}" ${S.xp < nextCost ? "disabled" : ""}>Sblocca ${nextCost}${ICON.sun.replace("<svg", '<svg width="16" height="16"')}</button></div>`);
  return `<div class="area"><h2>${A.title} <span>${inArea(a)}/${slotsOf(a)}</span></h2><p class="lead">${A.lead}</p><div class="grid">${slots.join("")}</div></div>`;
}
function renderSerra(){
  const empty = !S.garden.length;
  // Piante pronte che non hanno un posto libero dove possono stare: lo diciamo chiaro
  const waiting = Object.keys(PLANTS).filter(id => isReady(id) && !inGarden(id)
    && !(fitsIn(id, "casa") && freeSlots("casa") > 0) && !(balconyOpen() && freeSlots("balcone") > 0));
  const hint = waiting.length
    ? `<p class="lead" style="color:var(--leaf-dark)">${waiting.length === 1 ? `${PLANTS[waiting[0]].name} è ${gen(waiting[0], "pronto", "pronta")}` : `${waiting.length} piante sono pronte`}, ma non c’è un posto libero adatto. Sblocca un posto con l’esperienza.</p>` : "";
  return `<section class="sec"><h1>La tua serra</h1><p class="lead">${empty ? "È vuota. Silenzio. Pace. Nessuna vittima. Studia il basilico nel primo step del percorso e rovina tutto." : "Le gocce le tengono in vita, l’esperienza fa spazio. Il resto è ansia."}</p>${hint}${renderArea("casa")}${renderArea("balcone")}</section>
    ${DEV ? `<div class="test"><b>Strumenti per il test</b>Simula il passare del tempo per vedere come cambiano le piante.<div class="row" style="margin-top:10px"><button class="btn small ghost" data-skip="3">+3 giorni</button><button class="btn small ghost" data-skip="7">+7 giorni</button><button class="btn small ghost" data-skip="14">+14 giorni</button><button class="btn small ghost" id="forceEm">Emergenza ora</button><button class="btn small ghost" id="reset">Ricomincia da zero</button></div></div>` : ""}`;
}
let pickArea = "casa";
function openPicker(a){
  pickArea = a;
  const list = Object.keys(PLANTS).filter(id => S.discovered.includes(id) && !inGarden(id));
  const rows = list.map(id => { const k = kOf(id), ready = k >= RULES.knowledgeMax, cost = (id === "basilico" && !S.tutorialPlanted) ? 0 : PLANTS[id].cost;
    if (!fitsIn(id, a)) return `<div class="krow">${plantSVG(id, 46)}<div class="t"><b>${PLANTS[id].name}</b><span style="font-size:13px;color:var(--ink-2)">Vuole pieno sole: in casa non ce la fa.</span></div><span class="tag study">Solo balcone</span></div>`;
    return `<div class="krow">${plantSVG(id, 46)}<div class="t"><b>${PLANTS[id].name}</b><div class="bar ${ready ? "full" : ""}"><i style="width:${k / RULES.knowledgeMax * 100}%"></i></div></div>
    ${ready ? `<button class="btn small sun" style="width:auto" data-sow="${id}" ${S.xp < cost ? "disabled" : ""}>${cost ? `Pianta ${cost}` : "Gratis"}</button>` : `<span class="tag study">Studiala ancora</span>`}</div>`; }).join("");
  modal(`<h2>Cosa piantiamo ${a === "casa" ? "in casa" : "sul balcone"}?</h2><p class="lead" style="color:var(--ink-2);margin:6px 0 0;font-size:15px">Puoi piantare solo le piante con la barra della conoscenza piena. Niente scorciatoie: qui si studia.</p>
    <div class="pick">${rows || `<p style="color:var(--ink-2)">Non hai ancora scoperto piante da piantare. Fai il primo step del percorso.</p>`}</div><button class="btn ghost" data-close="1">Chiudi</button>`);
}
function ask(title, text, okLabel, onOk, cancelLabel){
  const m = modal(`<h2>${title}</h2><p style="color:var(--ink-2);font-size:16px;line-height:1.45;margin:8px 0 18px">${text}</p><div style="display:flex;flex-direction:column;gap:12px"><button class="btn bad" id="askOk">${okLabel}</button><button class="btn ghost" data-close="1">${cancelLabel}</button></div>`);

function modal(html){ const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="panel" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(m); m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-close]")) m.remove(); }); return m; }

/* --- Erbario --- */
function renderErbario(){
  const rows = Object.keys(PLANTS).map(id => { const known = S.discovered.includes(id), k = kOf(id), full = k >= RULES.knowledgeMax;
    if (!known) return `<div class="krow unknown"><div style="width:46px;height:50px;display:grid;place-items:center;font-size:26px">?</div><div class="t"><b>Pianta misteriosa</b><span style="font-size:13px;color:var(--ink-2)">La scopri andando avanti nel percorso.</span></div></div>`;

function openCard(id){

  const shown = Math.max(1, Math.round(k / RULES.knowledgeMax * p.facts.length));

}

/* =========================================================
   Eventi
   ========================================================= */
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.step !== undefined) { if (t.getAttribute("aria-disabled")) { toast("Prima finisci lo step prima. Le piante non saltano le tappe (e neanche tu)."); return; } openNode(+t.dataset.step); return; }
  if (t.dataset.water !== undefined) {
    const g = S.garden[+t.dataset.water]; if (S.gocce < RULES.waterCost) return toast("Zero gocce. Fai una lezione e torna (la pianta aspetta) (non a lungo).");
    // Annaffiare con la terra ancora umida alza il livello di "zuppo"; con la terra asciutta lo azzera
    const level = daysSince(g.wateredAt) < care(g).soak ? wetLevel(g) + 1 : 0;
    if (level >= care(g).rot) return ask("Ancora acqua?", `${esc(nameOf(g))} ha la terra ancora bagnata: con un altro sorso le radici marciscono${g.nick ? " e il soprannome se ne va con lei" : ""}. ${care(g).wetTip}`, "Annaffia lo stesso", () => water(g, level), "Aspetto");
    return water(g, level);
  }
  if (t.dataset.nick !== undefined) return openNick(S.garden[+t.dataset.nick]);
  if (t.dataset.em !== undefined) return openEmergency(S.garden[+t.dataset.em]);
  if (t.id === "forceEm") { const g = S.garden.find(x => !x.dead && !x.em); if (!g) return toast("Nessuna pianta viva senza emergenze."); rollEmergency(g, now()); if (!g.em) return toast("Prima fai lo step dove si impara a curarla."); render(); return; }
  if (t.dataset.feel !== undefined) { felt.add(S.garden[+t.dataset.feel]); render(); return; }
  if (t.dataset.replant !== undefined) { const g = S.garden[+t.dataset.replant]; S.gocce -= RULES.replantCost; g.dead = false; g.cause = null; g.note = null; g.rip = null; g.bornAt = now(); g.mile = 0; g.diedAt = null; g.wet = 0; g.wateredAt = now(); render(); toast("Il seme è a terra. Seconda vita, stessa persona responsabile."); return; }
  if (t.dataset.buy) { const a = t.dataset.buy, c = RULES.slotCosts[a][slotsOf(a)]; if (S.xp < c) return; S.xp -= c; if (a === "casa") S.slots++; else S.balcSlots++; render(); bump("#pXp"); toast("Nuovo posto in serra. Più spazio, più occasioni di fallire."); return; }
  if (t.dataset.plantHere) return openPicker(t.dataset.plantHere);
  if (t.dataset.skip) { felt = new WeakSet(); S.offset += +t.dataset.skip * DAY; render(); toast(`Sono passati ${t.dataset.skip} giorni. Le piante hanno preso appunti.`); return; }
  if (t.id === "reset") return ask("Ricominciare da zero?", "Si perde tutto: piante, gocce, esperienza. Anche la dignità.", "Ricomincia", () => { S = fresh(); tab = "path"; render(); }, "Annulla");
  if (t.dataset.card) return openCard(t.dataset.card);
});
function water(g, level){
  S.gocce -= RULES.waterCost; g.wateredAt = now(); g.wet = level; felt.delete(g);
  const c = care(g), dead = level >= c.rot, n = nameOf(g);
  if (dead) kill(g, "marcita");
  render(); bump("#pGocce");
  toast(!level ? `${n} ha bevuto. Ti perdona. (Per ora.)`
    : dead ? `${n} ha le radici marcite. ${c.wetTip}`
    : level >= c.rot - 1 ? `${n} ha la terra fradicia: un altro sorso e le radici marciscono. ${c.wetTip}`
    : `${n} ha la terra zuppa: era ancora umida. ${c.wetTip}`);
}
function openEmergency(g){
  const e = EMERG[g.em.id], stepIdx = STEPS.findIndex(s => s.id === e.step), step = STEPS[stepIdx];
  const left = Math.max(1, EM.deadline - Math.floor((now() - g.em.at) / DAY));
  const head = `<div style="display:flex;gap:12px;align-items:center">${plantSVG(g.plant, 70)}<div><div class="kind" style="color:var(--bad);margin:0">Emergenza</div><h2>${esc(e.title)}</h2></div></div>
    <p style="color:var(--ink-2);font-size:14px;margin:8px 0 0">${esc(nameOf(g))} resiste ancora ${left} ${left === 1 ? "giorno" : "giorni"}. Poi è finita.</p>`;
  if (g.em.retryAt > now()) {
    const m = modal(`${head}<p class="lead" style="font-size:16px;line-height:1.45;margin:14px 0">Hai già provato una cura, e non era quella giusta. Riprova domani, oppure ripassa lo step “${esc(step.title)}”: la risposta è lì, e dopo puoi riprovare subito.</p>
      <div style="display:flex;flex-direction:column;gap:12px"><button class="btn" id="goStep">Ripassa “${esc(step.title)}”</button><button class="btn ghost" data-close="1">Chiudi</button></div>`);
    m.querySelector("#goStep").onclick = () => { m.remove(); startLesson(stepIdx, Math.min(e.lesson || 0, progOf(step) - 1)); };
    return;
  }
  const m = modal(`${head}<div class="q" style="font-size:20px;margin:16px 0 12px">${esc(e.q)}</div><div class="opts">${shuffle(e.o.map((o, k) => [o, k])).map(([o, k]) => `<button class="opt" data-cure="${k}">${esc(o)}</button>`).join("")}</div><div id="emOut"></div><button class="btn ghost" data-close="1" style="margin-top:14px">Ci penso dopo</button>`);
  m.querySelectorAll("[data-cure]").forEach(b => b.onclick = () => {
    const ok = +b.dataset.cure === e.a;
    m.querySelectorAll("[data-cure]").forEach(x => x.disabled = true);
    b.classList.add(ok ? "ok" : "ko");
    if (ok) { delete g.em; g.calmUntil = now() + EM.calm * DAY; S.gocce += EM.cureGocce; S.xp += EM.cureXp; }
    else g.em.retryAt = now() + DAY;
    save();
    m.querySelector("#emOut").innerHTML = ok
      ? `<div class="card" style="margin-top:14px;font-size:15px"><b style="color:var(--leaf-dark)">Salvata.</b> ${esc(e.why)} <b style="color:var(--water)">+${EM.cureGocce} gocce</b>, <b style="color:var(--sun-dark)">+${EM.cureXp} esperienza</b>.</div>`
      : `<div class="card" style="margin-top:14px;font-size:15px;background:var(--bad-bg);border-color:var(--bad)"><b style="color:var(--bad)">Non era la cura giusta.</b> Riprova domani, oppure ripassa lo step “${esc(step.title)}” e riprova subito.</div>`;
    m.querySelector("[data-close]").textContent = "Torna alla serra";
    m.addEventListener("click", ev => { if (ev.target.closest("[data-close]") || ev.target === m) render(); });
  });
}
function openNick(g){
  const m = modal(`<form id="nickForm"><h2>Come ${gen(g.plant, "lo", "la")} chiami?</h2><p style="color:var(--ink-2);margin:6px 0 0;font-size:15px">Un soprannome per ${gen(g.plant, "il tuo", "la tua")} ${PLANTS[g.plant].name}. Dare un nome crea un legame. E un senso di colpa: se muore, il soprannome se ne va con lei.</p>
    <label for="nickIn" class="kind" style="display:block;margin-top:16px">Soprannome</label><input id="nickIn" class="field" style="margin-top:4px" maxlength="20" autocomplete="off" value="${esc(g.nick || "")}" placeholder="${PLANTS[g.plant].name}">
    <div style="display:flex;flex-direction:column;gap:12px"><button class="btn" type="submit">Salva</button>${g.nick ? '<button class="btn ghost" type="button" id="nickOff">Togli il soprannome</button>' : ""}<button class="btn ghost" type="button" data-close="1">Annulla</button></div></form>`);
  const input = m.querySelector("#nickIn"); input.focus();
  const done = v => { g.nick = v || undefined; m.remove(); render();
    toast(v ? `Da oggi si chiama ${v}. Se muore adesso è un lutto vero.` : `Torna a chiamarsi ${PLANTS[g.plant].name}. Come un estraneo.`); };
  m.querySelector("#nickForm").onsubmit = e => { e.preventDefault(); done(input.value.trim().replace(/\s+/g, " ")); };
  m.querySelector("#nickOff")?.addEventListener("click", () => done(""));
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-sow]"); if (!t) return;
  const id = t.dataset.sow, free = id === "basilico" && !S.tutorialPlanted, cost = free ? 0 : PLANTS[id].cost;
  if (!fitsIn(id, pickArea)) return;
  if (freeSlots(pickArea) <= 0) { toast("Nessun posto libero. La serra è piena come un monolocale in sei."); return; }
  if (S.xp < cost) return;
  S.xp -= cost; if (free) S.tutorialPlanted = true;
  S.garden.push({ plant:id, area:pickArea, wateredAt: now(), bornAt: now(), mile: 0, dead:false });
  document.querySelector(".modal")?.remove(); render(); bump("#pXp");
  toast(id === "basilico" ? "Il basilico è in serra. Stavolta va diversamente. (Diciamo sempre così.)" : `${PLANTS[id].name} ${gen(id, "piantato", "piantata")}. ${gen(id, "Benvenuto", "Benvenuta")} nella tua famiglia disfunzionale.`);
});
render();
</script>
